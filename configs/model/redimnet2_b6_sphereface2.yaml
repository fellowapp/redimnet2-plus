# ReDimNet2-B0 + SphereFace2 head (pairs with ``loss=sphereface2``).
defaults:
  - redimnet2_b6_pretrained

classifier:
  _target_: asv.models.classifier.SphereFace2Head
  in_features: 192
  num_classes: ${model.num_classes}
  scale: 32
  margin: 0.25
  first_margin: 0.3
  last_margin: 0.3
  lanbuda: 0.7
  t: 3
  margin_type: C
