[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asv"
version = "0.1.0"
description = "ASV training backbone: manifests, data loading, models, and Hydra-driven training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.33.0",
    "hydra-core>=1.3.0",
    "matplotlib>=3.7.0",
    "loguru>=0.7.2",
    "mlop-sl>=0.0.3",
    "numpy>=1.24.0",
    "nvidia-npp>=13.1.0.44",
    "omegaconf>=2.3.0",
    "pillow>=12.2.0",
    "pyarrow>=14.0.0",
    "pydub>=0.25.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "torch>=2.2.0",
    "torch-audiomentations>=0.11.0",
    "torchaudio>=2.2.0",
    "torchcodec>=0.1.0",
    "tqdm>=4.66.0",
    "onnx>=1.21.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.hatch.build.targets.wheel]
packages = ["asv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
